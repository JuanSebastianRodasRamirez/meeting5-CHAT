services:
  - type: web
    name: meeting5-chat
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_PRINCIPAL_URL
        sync: false  
      - key: FRONTEND_URL
        sync: false  
      - key: JWT_SECRET
        sync: false  
